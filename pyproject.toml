[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parafit"
version = "0.1.0"
description = "A pluggable analytical solver for parametric model fitting (hands, bodies, objects) from multi-view evidence."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Marsil Zakour" }]
keywords = ["levenberg-marquardt", "hand-pose", "MANO", "MHR", "UmeTrack", "multi-view", "solver", "differentiable-optimization"]

# Core stays light: torch + tensordict (the batchable State/GNBlock/Observations
# containers). torch+CUDA is best installed by the user for their platform first,
# so we depend loosely rather than hard-pinning.
dependencies = ["torch>=2.1", "tensordict>=0.5", "numpy>=1.23"]

[project.optional-dependencies]
# Parametric hand/body models.
mano = ["smplx>=0.1.28"]          # manotorch is git-only -> see [tool.uv.sources]
smplx = ["smplx>=0.1.28"]
umetrack = []                      # torch-only; hand-model json from facebookresearch/UmeTrack (CC-BY-NC, not vendored)
mhr = []                           # torch-only from a cache (MhrModel.from_cache); building the cache needs pymomentum + MHR assets
# Energies with heavy geometry deps.
contact = ["mesh2sdf>=1.1", "trimesh>=4.0"]
# Meta.
all = ["smplx>=0.1.28", "mesh2sdf>=1.1", "trimesh>=4.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/MarsilZakour/parafit"
Repository = "https://github.com/MarsilZakour/parafit"

[tool.hatch.build.targets.wheel]
packages = ["src/parafit"]

# uv-specific: git-only dependencies (manotorch has no PyPI release). Installs
# cleanly under `uv pip install 'parafit[mano]'`; a plain-pip PyPI build cannot
# declare git deps, so document manotorch as a manual step there.
[tool.uv.sources]
manotorch = { git = "https://github.com/lixiny/manotorch.git" }

[dependency-groups]  # PEP 735, consumed by uv
dev = ["pytest>=7", "ruff>=0.4"]

[tool.ruff]
line-length = 110
